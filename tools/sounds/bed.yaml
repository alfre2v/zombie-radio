# The static bed's candidates: the clips copied into the app, measured. Which of them play, and any change of a clip's
# level by ear, is the story's to say: the fork's stories/lab-outbreak/bed.yaml. Change a line, then:
#   uv run python tools/sounds/prepare_bed.py            (a dry run: the clips, their levels and gains)
#   uv run python tools/sounds/prepare_bed.py --write    (copies them into the app, with bed.json)
pool: ../zombie-radio-datasets/sounds/freesound
app: ~/TalkWithZombies-client/Sounds/bed
loudness_dbfs: -20

