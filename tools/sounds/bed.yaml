# The static bed: the clips the show plays, quietly, under the voices. Change a line, then:
#   uv run python tools/sounds/prepare_bed.py            (a dry run: the clips, their levels and gains)
#   uv run python tools/sounds/prepare_bed.py --write    (copies them into the app, with bed.json)
pool: ../zombie-radio-datasets/sounds/freesound
app: ~/TalkWithZombies-client/Sounds/bed
loudness_dbfs: -20

# Freesound ids; a clip may carry its own gain_db, which replaces the measured one: - {id: 11859, gain_db: -3}
clips:
  - 11859
  - 719588
  - 615189
  - 730109
  - 625095
  - 34418
  - 396902
  - 652596
  - 30302
  - 722884
  - 557532
  - 624412
  - 255775
  - 343740
  - 855480
  - 658932
  - 546450
