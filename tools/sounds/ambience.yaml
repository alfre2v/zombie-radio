  - {tag: running-shouting, kind: spot, seconds: 5, keep: [], prompt: "People running and shouting in a street far away"}

  # The city — textures
  - {tag: city-burning, kind: texture, seconds: 25, keep: [], prompt: "A city burning at night in the distance, fire crackling, faint sirens, continuous"}
  - {tag: city-chaos-far, kind: texture, seconds: 25, keep: [], prompt: "Distant chaos in a city at night, sirens, alarms and faint shouting, muffled and continuous"}
  - {tag: wind-empty-street, kind: texture, seconds: 25, keep: [], prompt: "Wind howling through an empty street at night, loose debris rattling, continuous"}
  - {tag: rain-window, kind: texture, seconds: 25, keep: [], prompt: "Heavy rain on a laboratory window with distant rolling thunder, continuous"}
