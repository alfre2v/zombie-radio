---
- name: Assert the target OS is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      This playbook assumes Ubuntu (named portability bet,
      docs/discussions/2026-09-17-ansible-deployment-shape.md).
      Found: {{ ansible_facts['distribution'] | default('unknown') }}.
    quiet: true

- name: Assert Docker and NVIDIA tooling are present (asserted, never installed)
  ansible.builtin.command: "which {{ item }}"
  loop:
    - docker
    - nvidia-smi
    - nvidia-ctk
  changed_when: false

# The driver's reported "CUDA Version" is the MAXIMUM runtime it supports;
# wheels/images built for a NEWER CUDA major hard-fail on it ("driver too
# old", found live 2026-09-18). Same-major/older-minor is tolerated (CUDA
# minor-version compatibility). Full rule: provider survey S5.
- name: Read the driver's supported CUDA version
  ansible.builtin.shell: >-
    set -o pipefail;
    nvidia-smi -q | awk -F': *' '/CUDA Version/ && !seen {print $2; seen=1}'
  args:
    executable: /bin/bash
  register: base_cuda_probe
  changed_when: false

# Majors are precomputed in vars ON PURPOSE: complex Jinja inside assert.that
# evaluates through a different path than {{ }} templating and can silently
# yield the wrong verdict (found live 2026-09-19: the inline-regex form passed
# 12.4-vs-cu130). Keep the that: expression trivial.
- name: Assert the driver can run the pinned CUDA generation
  vars:
    base_cuda_driver_major: "{{ base_cuda_probe.stdout | trim | split('.') | first }}"
    base_cuda_variant_major: "{{ base_cuda_variant | regex_replace('^cu(\\d+)\\d$', '\\1') }}"
  ansible.builtin.assert:
    that:
      - base_cuda_driver_major | int >= base_cuda_variant_major | int
    fail_msg: >-
      The driver supports CUDA {{ base_cuda_probe.stdout | trim }} at most,
      but the wheel pins target {{ base_cuda_variant }} — an older-major
      driver crash-loops ("driver too old"). Fix: provision an image with a
      newer driver branch, or lower zr_cuda_variant in a 99-<env> override.
    quiet: true

- name: Ensure the Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
