---
- name: Assert the target OS is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      This playbook assumes Ubuntu (named portability bet,
      docs/discussions/2026-09-17-ansible-deployment-shape.md).
      Found: {{ ansible_facts['distribution'] | default('unknown') }}.
    quiet: true

- name: Assert Docker and NVIDIA tooling are present (asserted, never installed)
  ansible.builtin.command: "which {{ item }}"
  loop:
    - docker
    - nvidia-smi
    - nvidia-ctk
  changed_when: false

- name: Ensure the Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
