---
# Project-variable mappings. The CUDA generation the engine wheels and service
# images are built for; the driver preflight asserts the box can run it.
base_cuda_variant: "{{ zr_cuda_variant }}"
base_apt_lock_timeout: "{{ zr_apt_lock_timeout }}"

base_packages:
  - python3-venv
  - sox
  - git
  - acl  # lets become_user drop from root to the service user (tmpfile perms)
