---
zr_environment: lan
# The owner's RTX 3090 desktop on the home network, deployed from the laptop.
ansible_user: alfredo
zr_service_user: alfredo
ansible_ssh_private_key_file: "~/.ssh/zombie_radio_3090"
zr_start_at_boot: false
# Every model and the voice's Python environment, in one folder.
zr_data_dir: "/home/{{ zr_service_user }}/zombie-radio-data"
zr_models_dir: "{{ zr_data_dir }}/models"
zr_stt_cache_dir: "{{ zr_data_dir }}/whisper-cache"
zr_tts_hf_home: "{{ zr_data_dir }}/voice-cache"
zr_tts_root: "{{ zr_data_dir }}/{{ zr_tts_engine }}"
