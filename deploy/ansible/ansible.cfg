[defaults]
collections_path = ./collections
# Explicit: the built-in default points at ~/.ansible/roles first, so a stray
# global role could shadow ours.
roles_path = roles
# Refuse vault fallback-guessing across identities (strict from day one; the
# vault slots are reserved even though none exists yet).
vault_id_match = True
interpreter_python = auto_silent

[inventory]
# A typo'd/unparseable -i is only a WARNING by default: the play matches zero
# hosts and exits 0 — a green deploy of nothing. Fail instead.
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True
