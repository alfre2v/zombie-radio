<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>From tokens to lines to voice chunks</title><desc>llama.cpp streams tokens; the server's LineParser cuts them at line breaks and sends one done event per line; the browser's chunks function packs each line's sentences into chunks of up to about 100 characters; each chunk is one request to the voice.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="452" fill="#ffffff"/>
<rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">llama.cpp streams tokens</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">"Daniel", " (", "rel", "ieved"…</text>
<rect x="190" y="132" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">LineParser, on the server</text>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">cuts at each line break</text>
<rect x="190" y="224" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">done: one whole line</text>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">the SSE event, full text</text>
<rect x="190" y="316" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">chunks(), in the browser</text>
<text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">sentences packed to ~100 chars</text>
<rect x="190" y="396" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">one POST /api/tts per chunk</text>
<g stroke="#73726c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="340" y1="98" x2="340" y2="128"/>
<line x1="340" y1="190" x2="340" y2="220"/>
<line x1="340" y1="282" x2="340" y2="312"/>
<line x1="340" y1="374" x2="340" y2="392"/>
</g>
</svg>
